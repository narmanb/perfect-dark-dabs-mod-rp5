name: Android RP5 Build
# Reference SMAA High/Ultra runs as the final post-processing stage.

on:
  push:
    branches: [android-port]
  pull_request:
    branches: [dabs-mod]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android native toolchain
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Preserve Android touch routing after resume
        run: python3 android/fix-touch-resume.py

      - name: Apply Android post-processing extensions
        run: python3 android/apply-postfx.py

      - name: Fix Post FX menu integration
        run: python3 android/fix-postfx-menu.py

      - name: Tune Post FX visibility
        run: python3 android/tune-postfx-visible.py

      - name: Apply Post FX pass 3
        run: python3 android/apply-postfx-pass3.py

      - name: Retune Post FX pass 3
        run: python3 android/tune-postfx-pass3.py

      - name: Fetch pinned SMAA reference assets
        shell: bash
        run: |
          set -euo pipefail
          SMAA_REF="71c806a838bdd7d517df19192a20f0c61b3ca29d"
          SMAA_DIR="port/fast3d/smaa_ref"
          mkdir -p "$SMAA_DIR"
          curl -fsSL "https://raw.githubusercontent.com/iryoku/smaa/${SMAA_REF}/SMAA.hlsl" -o "$SMAA_DIR/SMAA.hlsl"
          curl -fsSL "https://raw.githubusercontent.com/iryoku/smaa/${SMAA_REF}/Textures/AreaTex.h" -o "$SMAA_DIR/AreaTex.h"
          curl -fsSL "https://raw.githubusercontent.com/iryoku/smaa/${SMAA_REF}/Textures/SearchTex.h" -o "$SMAA_DIR/SearchTex.h"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("port/fast3d/smaa_ref/SMAA.hlsl")
          # Upstream SMAA.hlsl contains a few Windows-1252 punctuation bytes in comments.
          # Normalize those comments to UTF-8 before embedding the shader text in C++.
          src = p.read_bytes().decode("cp1252")
          delimiter = "SMAAREF"
          if f"){delimiter}\"" in src:
              raise SystemExit("SMAA raw-string delimiter collision")
          Path("port/fast3d/smaa_ref/SMAASource.h").write_text(
              "#pragma once\n"
              "// Generated from the pinned iryoku/smaa SMAA.hlsl reference implementation.\n"
              f"static const char *smaa_reference_source = R\"{delimiter}(\n{src}\n){delimiter}\";\n",
              encoding="utf-8",
          )
          PY

      - name: Apply reference SMAA final pass
        run: python3 android/apply-smaa-reference.py

      - name: Fix SMAA diagnostics menu layout
        run: python3 android/fix-smaa-menu-layout.py

      - name: Correct SMAA neighborhood color space
        run: python3 android/fix-smaa-linear-light.py

      - name: Correct SMAA OpenGL coordinate orientation
        run: python3 android/fix-smaa-gl-orientation.py

      - name: Restore two-sided SMAA neighborhood resolve
        run: python3 android/fix-smaa-two-sided-resolve.py

      - name: Finalize AA menu and SMAA High preset
        run: python3 android/finalize-aa-modes.py

      - name: Hide desktop-only recording and updater UI
        run: python3 android/cleanup-android-menus.py

      - name: Apply physical right-stick aiming overhaul
        run: python3 android/fix-right-stick-aiming.py

      - name: Validate generated SMAA on OpenGL ES
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1-mesa-dri python3-numpy g++
          /usr/bin/python3 android/tests/verify-smaa.py 2>&1 | tee smaa-validation.log
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths = ["port/fast3d/gfx_opengl.cpp", "port/src/optionsmenu.c"]
          Path("smaa-validation/build.json").write_text(json.dumps({
              "commit": os.environ["GITHUB_SHA"],
              "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "generated_sha256": {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
          }, indent=2) + "\n")
          PY

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../android-build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | sed -n '1p'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload generated renderer and GLES evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smaa-diagnostics-run${{ github.run_number }}
          path: |
            smaa-validation.log
            smaa-validation/*.json
            smaa-validation/*.frag
            port/fast3d/gfx_opengl.cpp
            port/src/optionsmenu.c
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-dark-dabs-rp5-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
