name: Android RP5 Build

on:
  push:
    branches: [android-port]
  pull_request:
    branches: [dabs-mod]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android native toolchain
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Apply Android post-processing extensions
        run: python3 android/apply-postfx.py

      - name: Fix Post FX menu integration
        run: python3 android/fix-postfx-menu.py

      - name: Tune Post FX visibility
        run: python3 android/tune-postfx-visible.py

      - name: Apply Post FX pass 3
        run: python3 android/apply-postfx-pass3.py

      - name: Retune Post FX pass 3
        run: python3 android/tune-postfx-pass3.py

      - name: Apply Post FX pass 4
        run: python3 android/apply-postfx-pass4.py

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../android-build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-dark-dabs-rp5-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
