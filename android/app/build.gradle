plugins {
    id 'com.android.application'
}

// GitHub Actions creates a fresh machine for every build. Use the workflow run
// number as an always-increasing Android version code so each artifact can be
// installed over the previous one instead of being treated as a downgrade.
def androidVersionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def androidVersionName = "1.0.${androidVersionCode}"

// Load signing credentials from keystore.properties (support both root and android/ locations)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = rootProject.file("android/keystore.properties")
}
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.perfectdark.port'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.perfectdark.dabsmod"
        minSdk 21
        targetSdk 34
        versionCode androidVersionCode
        versionName androidVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters 'arm64-v8a'
        }
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared",
                         "-DANDROID_PLATFORM=android-21",
                         "-DTARGET_OS=android"
            }
        }
    }

    signingConfigs {
        // This is a deliberately public TEST key, committed only so CI debug
        // builds keep the same Android signing identity from one run to the next.
        // Never use it for a Play Store or other production release.
        debug {
            storeFile file('ci-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (keystorePropertiesFile.exists()) {
                // Resolve storeFile robustly
                def rawPath = keystoreProperties['storeFile']
                if (!rawPath) throw new GradleException("storeFile missing in keystore.properties")
                // If keystore.properties is inside 'android' and path starts with 'android/', strip it
                if (keystorePropertiesFile.parentFile.name == 'android' && rawPath.startsWith('android/')) {
                    rawPath = rawPath.substring('android/'.length())
                }
                File resolved = new File(rawPath)
                if (!resolved.isAbsolute()) {
                    // Prefer relative to the keystore.properties location
                    File propRel = new File(keystorePropertiesFile.parentFile, rawPath)
                    if (propRel.exists()) {
                        resolved = propRel
                    } else {
                        // Fallback: resolve relative to the Gradle root project directory
                        resolved = new File(rootProject.projectDir, rawPath)
                    }
                }
                storeFile file(resolved)
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Pin debug artifacts to the committed CI test key. Without this,
            // each GitHub runner creates a new ~/.android/debug.keystore and
            // Android correctly refuses to update the previously installed APK.
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release only if keystore is present
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Include native symbol table for easier crash decoding
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
    
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
